[package]
name = "PicoOS"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"

[[bin]]
name = "PicoOS"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
# Public scenario selectors (PR21). Internal resume_* / scheduler_* flags
# remain as the implementation of these clusters.
scenario_resume = ["task_resume_selftest"]
scenario_sleep = ["task_sleep_runtime_e2e_selftest"]
scenario_handoff = ["two_task_resume_handoff_selftest"]
scenario_fault = ["scheduler_fault_lifecycle_test"]
scenario_preempt = ["timer_preemption_selftest"]
scenario_kernel_fault = ["kernel_fault_guard_test"]
scenario_reap = ["selftest"]
scenario_run = ["scheduler_run_selftest"]
scenario_reentry = ["scheduler_reentry_selftest"]

selftest = []
task_yield_test = []
resume_candidate_test = []
resume_preflight_test = []
resume_dry_run_test = []
resume_restore_test = []
real_resume_restore_test = []
real_resume_restore_jump = []
two_yield_task_test = []
scheduler_resume_loop_test = []
verbose_resume_debug = []
scheduler_dispatch_test = []
scheduler_run_test = []
scheduler_reentry_test = []
two_task_resume_handoff_test = []
task_fault_test = []
kernel_fault_guard_test = [
  "scheduler_fault_lifecycle_test",
]
scheduler_verbose_dispatch_trace = []
task_sleep_test = []
task_sleep_runtime_e2e_test = []
kernel_log_scoped = []
log_trap = []
log_timer = []
log_fault = []
log_sleep = []
timer_preemption_prototype = []

two_task_resume_handoff_selftest = [
  "scheduler_reentry_selftest",
  "two_task_resume_handoff_test",
]

scheduler_run_once_selftest = [
  "task_resume_selftest",
  "scheduler_dispatch_test",
]

scheduler_run_selftest = [
  "scheduler_run_once_selftest",
  "scheduler_run_test",
]

scheduler_runtime_selftest = [
  "scheduler_run_selftest",
]

scheduler_reentry_selftest = [
  "scheduler_runtime_selftest",
  "scheduler_reentry_test",
]

task_resume_selftest = [
  "task_yield_test",
  "resume_candidate_test",
  "resume_preflight_test",
  "resume_dry_run_test",
  "resume_restore_test",
  "real_resume_restore_test",
  "real_resume_restore_jump",
  "two_yield_task_test",
  "scheduler_resume_loop_test",
]

timer_preemption_selftest = [
  "task_yield_test",
  "timer_preemption_prototype",
]

task_sleep_runtime_e2e_selftest = [
  "task_yield_test",
  "task_sleep_test",
  "task_sleep_runtime_e2e_test",
  "timer_preemption_prototype",
  "real_resume_restore_test",
  "real_resume_restore_jump",
]

scheduler_fault_lifecycle_test = [
  "task_yield_test",
  "task_fault_test",
  "scheduler_reentry_test",
  "scheduler_dispatch_test",
  "scheduler_run_test",
  "scheduler_resume_loop_test",
  "resume_restore_test",
  "real_resume_restore_test",
  "real_resume_restore_jump",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
elided_lifetimes_in_paths = "deny"
unused_unsafe = "deny"

[lints.clippy]
# Groups: default `all` plus pedantic, nursery, and cargo. Restriction is
# not a group here (it fights a kernel); selected restriction lints are
# denied individually. scripts/check-all.sh also passes these as -D flags.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
fn_to_numeric_cast_any = "allow"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
same_name_method = "deny"
wildcard_dependencies = "deny"
exit = "deny"

# Kernel / no_std / later-PR exceptions (documented, not a dump of pedantic).
infinite_loop = "allow"                 # idle/wfi and panic halt loops
cargo_common_metadata = "allow"         # binary kernel, not a crates.io package
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
missing_safety_doc = "allow"            # remaining unsafe is CSR/MMIO/asm; IrqCell has SAFETY
undocumented_unsafe_blocks = "allow"    # same
multiple_unsafe_ops_per_block = "allow" # same
module_name_repetitions = "allow"
too_many_lines = "allow"                # restore.rs UART restore contract still exceeds 100
manual_memcpy = "allow"                 # table create_task still copies fields explicitly
inline_always = "allow"                 # CSR/MMIO helpers
large_stack_arrays = "allow"            # static task table
cast_possible_truncation = "allow"      # MMIO/CSR width conversions
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
unreadable_literal = "allow"            # 0x8000_0000 style is already used
wildcard_imports = "allow"              # crate::arch re-exports
ptr_as_ptr = "allow"
borrow_as_ptr = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"
option_if_let_else = "allow"
map_unwrap_or = "allow"
single_match = "allow"
single_match_else = "allow"
match_single_binding = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
use_self = "allow"
collapsible_if = "allow"
match_wildcard_for_single_variants = "allow"
manual_map = "allow"
