[package]
name = "PicoOS"
version = "0.1.52"
edition = "2021"

[[bin]]
name = "PicoOS"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
selftest = []
task_bootstrap_test = []
task_stack_switch_test = []
sequential_task_test = []
task_yield_test = []
scheduler_skip_finished_test = []
scheduler_driven_task_test = []
resume_candidate_test = []
resume_preflight_test = []
resume_dry_run_test = []
resume_restore_test = []
real_resume_restore_test = []
real_resume_restore_jump = []
two_yield_task_test = []
scheduler_resume_loop_test = []
verbose_resume_debug = []
scheduler_dispatch_test = []
scheduler_run_test = []
scheduler_reentry_test = []
two_task_resume_handoff_test = []
task_fault_test = []
trap_to_task_fault_test = []
real_trap_classification_test = []
real_trap_handler_classification_test = []
scheduler_verbose_dispatch_trace = []
kernel_fault_guard_test = []
trap_fault_metadata_test = []
task_fault_assertions_test = []
faulted_task_dispatch_guard_test = []
finished_task_dispatch_guard_test = []
no_runnable_scheduler_policy_test = []

two_task_resume_handoff_selftest = [
  "scheduler_reentry_selftest",
  "two_task_resume_handoff_test",
]

scheduler_run_once_selftest = [
  "task_resume_selftest",
  "scheduler_dispatch_test",
]

scheduler_dispatch_selftest = [
  "scheduler_run_once_selftest",
]

scheduler_run_selftest = [
  "scheduler_run_once_selftest",
  "scheduler_run_test",
]

scheduler_runtime_selftest = [
  "scheduler_run_selftest",
]

scheduler_reentry_selftest = [
  "scheduler_runtime_selftest",
  "scheduler_reentry_test",
]

task_resume_selftest = [
  "task_yield_test",
  "resume_candidate_test",
  "resume_preflight_test",
  "resume_dry_run_test",
  "resume_restore_test",
  "real_resume_restore_test",
  "real_resume_restore_jump",
  "two_yield_task_test",
  "scheduler_resume_loop_test",
]

scheduler_fault_lifecycle_test = [
  "task_yield_test",
  "task_fault_test",
  "trap_to_task_fault_test",
  "real_trap_classification_test",
  "real_trap_handler_classification_test",
  "scheduler_reentry_test",
  "scheduler_dispatch_test",
  "scheduler_run_test",
  "scheduler_resume_loop_test",
  "resume_restore_test",
  "real_resume_restore_test",
  "real_resume_restore_jump",
]
