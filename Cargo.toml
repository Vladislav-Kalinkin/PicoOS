[package]
name = "PicoOS"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"

[[bin]]
name = "PicoOS"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"
debug = false

[features]
# Public scenario selectors. Always-on: U-mode mret, timer preemption via
# mret, reap on the ecall path, scheduler start via mret. Scenario flags
# only pick workers and UART contracts. There is no M-mode yield_now path.
scenario_resume = []
scenario_reap = []
scenario_sleep = []
scenario_handoff = []
scenario_fault = []
scenario_preempt = []
scenario_kernel_fault = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
elided_lifetimes_in_paths = "deny"
unused_unsafe = "deny"

[lints.clippy]
# Groups: default `all` plus pedantic, nursery, and cargo. Restriction is
# not a group here (it fights a kernel); selected restriction lints are
# denied individually. scripts/check-all.sh also passes these as -D flags.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
fn_to_numeric_cast_any = "allow"
rest_pat_in_fully_bound_structs = "deny"
empty_structs_with_brackets = "deny"
same_name_method = "deny"
wildcard_dependencies = "deny"
exit = "deny"

# Kernel / no_std / later-PR exceptions (documented, not a dump of pedantic).
infinite_loop = "allow"                 # idle/wfi and panic halt loops
cargo_common_metadata = "allow"         # binary kernel, not a crates.io package
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "allow" # CSR/MMIO asm blocks keep one instruction sequence
module_name_repetitions = "allow"
too_many_lines = "deny"
manual_memcpy = "deny"
inline_always = "allow"                 # CSR/MMIO helpers
large_stack_arrays = "allow"            # static task table
cast_possible_truncation = "allow"      # MMIO/CSR width conversions
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
unreadable_literal = "allow"            # 0x8000_0000 style is already used
wildcard_imports = "allow"              # crate::arch re-exports
ptr_as_ptr = "allow"
borrow_as_ptr = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
unused_self = "allow"
option_if_let_else = "allow"
map_unwrap_or = "allow"
single_match = "allow"
single_match_else = "allow"
match_single_binding = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
use_self = "allow"
collapsible_if = "allow"
match_wildcard_for_single_variants = "allow"
manual_map = "allow"
